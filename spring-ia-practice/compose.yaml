services:
  postgres:
    image: pgvector/pgvector:0.8.7-pg18-trixie
    container_name: careflow-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-careflow}
      POSTGRES_USER: ${POSTGRES_USER:-careflow}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-careflow}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - careflow-postgres-data:/var/lib/postgresql
      - ./docker/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s
    labels:
      org.springframework.boot.service-connection: postgres

volumes:
  careflow-postgres-data:
