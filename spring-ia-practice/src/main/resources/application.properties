spring.application.name=spring-ia-practice

# Valores locais usados quando a aplicacao nao e iniciada pelo suporte a Docker Compose do Spring Boot.
spring.datasource.url=${POSTGRES_URL:jdbc:postgresql://localhost:5432/careflow}
spring.datasource.username=${POSTGRES_USER:careflow}
spring.datasource.password=${POSTGRES_PASSWORD:careflow}

# Modelos locais fornecidos pelo Ollama.
spring.ai.ollama.base-url=${OLLAMA_BASE_URL:http://localhost:11434}
spring.ai.ollama.chat.model=${OLLAMA_CHAT_MODEL:gemma4}
spring.ai.ollama.embedding.model=${OLLAMA_EMBEDDING_MODEL:jeffh/intfloat-multilingual-e5-large-instruct:q8_0}

# O Spring AI cria a tabela vector_store depois que um EmbeddingModel estiver configurado.
spring.ai.vectorstore.pgvector.initialize-schema=true
spring.ai.vectorstore.pgvector.dimensions=1024
spring.ai.vectorstore.pgvector.index-type=HNSW
spring.ai.vectorstore.pgvector.distance-type=COSINE_DISTANCE

# Persiste a janela de memoria das conversas no PostgreSQL.
spring.ai.chat.memory.repository.jdbc.initialize-schema=always

# OpenAPI e Swagger UI.
springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha
springdoc.swagger-ui.try-it-out-enabled=true
